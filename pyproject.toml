# Project metadata

[project]
name = "rsm-lang"
version = "1.5.0"
description = "Readable Science Markup (RSM) - A language for semantic research publishing"
readme = "README.md"
authors = [{ name = "Leo Torres", email = "leo@leotrs.com" }]
license = { file = "LICENSE.md" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["markup", "science", "publishing", "static site generator"]

# Production dependencies
dependencies = [
    "grandalf >= 0.8",
    "icecream >= 2.1.2",
    "livereload >= 2.6.3",
    "pygments >= 2.14.0",
    "tree-sitter >= 0.23.2",
    "tree-sitter-rsm>=1.5.0",
    "ujson >= 5.10.0",
]
requires-python = ">=3.10"


[project.urls]
Homepage = "https://write-rsm.org/"

[project.scripts]
rsm = "rsm.cli:main"


# Build system

[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rsm*", "braiid"]
exclude = ["tests*"]

[tool.setuptools.package-data]
rsm = ["*.so", "*.dll", "static/**/*"]
braiid = ["*.css", "*.md"]


# Tool configurations

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # use 'raise ... from err'
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"conftest.py" = ["E402"]  # import after setup code
"docs/source/conf.py" = ["E402"]  # import after sys.path manipulation
"rsm/__init__.py" = ["E402"]  # import after warnings filter
"tests/test_serve_closure_bug.py" = ["B023"]  # intentionally testing closure bugs

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["icecream.*", "livereload.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    'slow: marks tests as slow (deselect with "-m \"not slow\"")',
    "serial",
    'visual: marks tests as visual regression tests',
    'accessibility: marks tests as WCAG compliance tests',
    'interactive: marks tests as interactive browser behavior tests',
    'pandoc: marks tests that require the pandoc executable',
]
filterwarnings = [
    "ignore:.*pkg_resources.*:DeprecationWarning",
]
# Retry failed tests to tolerate occasional rendering variance and timeouts under parallel execution
addopts = "--reruns=2 --reruns-delay=1 --only-rerun='Snapshots DO NOT match|Timeout'"

[tool.uv.sources]
tree-sitter-rsm = { path = "tree-sitter-rsm", editable = true }

[dependency-groups]
dev = [
    # Testing
    "pytest>=7.1.1",
    "pytest-sugar>=0.9.6",
    "pytest-playwright>=0.4.0",
    "pytest-playwright-visual>=2.1.0",
    "pytest-xdist>=3.0.0",
    "pytest-rerunfailures>=15.0",
    "pytest-timeout>=2.3.0",
    "axe-playwright-python>=0.1.0",
    "pillow>=12.0.0",
    "pixelmatch>=0.3.0",
    # Linting and type checking
    "mypy>=1.16.1",
    "mypy-extensions>=1.0.0",
    "pre-commit>=2.20.0",
    "ruff>=0.1.0",
    "types-pygments>=2.19.0",
    "types-ujson>=5.6.0",
    # Documentation
    "Sphinx>=6.2.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-copybutton>=0.5.1",
    "sphinx-design>=0.5.0",
    "sphinx-autodoc-typehints>=1.19.5",
    "pydata-sphinx-theme>=0.12.0",
]
