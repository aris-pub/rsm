<!DOCTYPE html>
<html lang="en" data-accent="red" class="dark-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accent Color Test - Red Dark</title>
  <link rel="stylesheet" href="/braiid/braiid.css">
  <style>
    body {
      background-color: var(--surface-page);

      font-family: system-ui, -apple-system, sans-serif;

      padding: 2rem;
      margin: 0;

<body>
  <h2>Red - Dark Theme</h2>
  <div class="test-group">
    <a href="#" style="color: var(--link-default)">Default link (--link-default)</a>
