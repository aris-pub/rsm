name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. a new push to a PR) so they stop
# competing for the shared runner pool instead of piling up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      lsp: ${{ steps.filter.outputs.lsp }}
      rsmify: ${{ steps.filter.outputs.rsmify }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          lsp:
            - 'packages/rsm-lsp/**'
            - 'tree-sitter-rsm/**'
          rsmify:
            - 'packages/rsmify/**'
            - 'rsm/**'
            - 'tree-sitter-rsm/**'
            - 'pyproject.toml'
            - 'uv.lock'

  bundle-check:
    # rsm-standalone.js is committed, so a change to the reader JS without a
    # rebuild leaves standalone pages running old code. Rebuild it with the
    # pinned esbuild from the justfile and fail if the result differs.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Rebuild rsm-standalone.js
      run: |
        cmd=$(grep -E '^\s+npx .*esbuild' justfile | sed 's/^ *//')
        echo "$cmd"
        eval "$cmd"
    - name: Fail if the committed bundle is out of date
      run: |
        git diff --exit-code --stat rsm/static/rsm-standalone.js || {
          echo "rsm/static/rsm-standalone.js is out of date. Run 'just js-bundle' and commit the result."
          exit 1
        }

  lsp-tests:
    needs: changes
    if: ${{ needs.changes.outputs.lsp == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: uv sync

    - name: Build tree-sitter-rsm
      working-directory: tree-sitter-rsm
      run: |
        npm install
        npm run prebuildify

    - name: Install LSP dependencies
      working-directory: packages/rsm-lsp
      run: npm ci

    - name: Build LSP server
      working-directory: packages/rsm-lsp
      run: npm run build

    - name: Run all LSP tests
      working-directory: packages/rsm-lsp
      run: npm test -- --run

  rsmify-tests:
    needs: changes
    if: ${{ needs.changes.outputs.rsmify == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsmify and rsm-lang
      working-directory: packages/rsmify
      run: uv sync

    - name: Run rsmify tests
      working-directory: packages/rsmify
      run: uv run pytest -vv

  pytest:
    runs-on: ${{ matrix.os }}-latest

    env:
      PYTEST_ADDOPTS: "--color=yes"

    strategy:
      matrix:
        os: [ubuntu, macos]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: |
        uv sync
        uv pip list

    - name: Run unit tests
      run: |
        uv run pytest -vv -m "not visual and not accessibility and not interactive and not pandoc"

    - name: Run doctests in source files
      run: |
        uv run pytest -vv --doctest-modules rsm

    - name: Run doctests in doc files
      run: |
        cd docs && uv run make doctest

  pandoc-tests:
    # RSM's pandoc code does not depend on the system, so one system is
    # enough. The macOS job was often cancelled for lack of runners.
    runs-on: ubuntu-latest

    env:
      PYTEST_ADDOPTS: "--color=yes"

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: uv sync

    - name: Install pandoc
      run: sudo apt-get install -y pandoc

    - name: Run pandoc tests
      run: uv run pytest -vv tests/test_pandoc.py

  visual-tests:
    # Linux (amd64) instead of the scarce/slow macOS pool. Baselines are made in
    # the Playwright image below; its pinned version keeps Chromium (and its
    # rendering) fixed.
    runs-on: ubuntu-24.04
    # Microsoft's Playwright image has Chromium and its system libraries, so
    # the job does not install them with apt on every run (that step took up
    # to 9 minutes). Keep the tag equal to the playwright version in uv.lock.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 30

    env:
      PYTEST_ADDOPTS: "--color=yes"
      CC: /opt/zcc/cc
      UV_PYTHON_PREFERENCE: only-managed

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up a C compiler and uv
      run: |
        pip install --quiet ziglang
        mkdir -p /opt/zcc
        printf '#!/bin/sh\nexec /usr/bin/python3 %s/.github/zig-cc.py "$@"\n' "$GITHUB_WORKSPACE" > /opt/zcc/cc
        chmod +x /opt/zcc/cc
        ln -sf /opt/zcc/cc /opt/zcc/gcc
        echo "/opt/zcc" >> $GITHUB_PATH
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: |
        uv sync --python 3.12
        uv pip list

    - name: Run visual tests
      run: |
        uv run pytest -vv -m visual -n auto --timeout=60 --max-worker-restart=2

    - name: Upload visual test diffs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-test-diffs
        path: tests/visual/snapshot_tests_failures/
        retention-days: 7

  interactive-tests:
    runs-on: ubuntu-24.04
    # Microsoft's Playwright image has Chromium and its system libraries, so
    # the job does not install them with apt on every run (that step took up
    # to 9 minutes). Keep the tag equal to the playwright version in uv.lock.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 20

    # Four shards side by side keep this job well under the 10-minute run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      PYTEST_ADDOPTS: "--color=yes"
      CC: /opt/zcc/cc
      UV_PYTHON_PREFERENCE: only-managed
      RSM_TEST_SHARDS: 4
      RSM_TEST_SHARD: ${{ matrix.shard }}

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up a C compiler and uv
      run: |
        pip install --quiet ziglang
        mkdir -p /opt/zcc
        printf '#!/bin/sh\nexec /usr/bin/python3 %s/.github/zig-cc.py "$@"\n' "$GITHUB_WORKSPACE" > /opt/zcc/cc
        chmod +x /opt/zcc/cc
        ln -sf /opt/zcc/cc /opt/zcc/gcc
        echo "/opt/zcc" >> $GITHUB_PATH
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: uv sync --python 3.12

    - name: Run interactive tests
      run: uv run pytest tests/interactive/ -vv --browser chromium --timeout=60

  docs-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: uv sync

    - name: Build docs (warnings as errors)
      run: uv run python -m sphinx -b html -W docs/source docs/build/html

  accessibility-tests:
    # Linux (amd64) instead of the scarce macOS pool. These are axe-core rule
    # checks (no pixel snapshots), so rendering platform doesn't matter.
    runs-on: ubuntu-24.04
    # Microsoft's Playwright image has Chromium and its system libraries, so
    # the job does not install them with apt on every run (that step took up
    # to 9 minutes). Keep the tag equal to the playwright version in uv.lock.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      PYTEST_ADDOPTS: "--color=yes"
      CC: /opt/zcc/cc
      UV_PYTHON_PREFERENCE: only-managed
      RSM_TEST_SHARDS: 4
      RSM_TEST_SHARD: ${{ matrix.shard }}

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up a C compiler and uv
      run: |
        pip install --quiet ziglang
        mkdir -p /opt/zcc
        printf '#!/bin/sh\nexec /usr/bin/python3 %s/.github/zig-cc.py "$@"\n' "$GITHUB_WORKSPACE" > /opt/zcc/cc
        chmod +x /opt/zcc/cc
        ln -sf /opt/zcc/cc /opt/zcc/gcc
        echo "/opt/zcc" >> $GITHUB_PATH
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: |
        uv sync --python 3.12
        uv pip list

    - name: Run accessibility tests
      run: |
        uv run pytest -vv -m accessibility -n 2 --timeout=180
