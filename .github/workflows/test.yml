name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  lsp-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build tree-sitter-rsm
      working-directory: tree-sitter-rsm
      run: |
        npm install
        npm run prebuildify

    - name: Install LSP dependencies
      working-directory: packages/rsm-lsp
      run: npm ci

    - name: Build LSP server
      working-directory: packages/rsm-lsp
      run: npm run build

    - name: Run LSP tests
      working-directory: packages/rsm-lsp
      run: npm test -- --run

  pytest:
    runs-on: ${{ matrix.os }}-latest

    env:
      PYTEST_ADDOPTS: "--color=yes"

    strategy:
      matrix:
        os: [ubuntu, macos]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: |
        uv sync
        uv pip list

    - name: Run unit tests
      run: |
        uv run pytest -vv -m "not visual and not accessibility and not interactive"

    - name: Run doctests in source files
      run: |
        uv run pytest -vv --doctest-modules rsm

    - name: Run doctests in doc files
      run: |
        cd docs && uv run make doctest

  pandoc-tests:
    runs-on: ubuntu-latest

    env:
      PYTEST_ADDOPTS: "--color=yes"

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: uv sync

    - name: Install pandoc
      run: sudo apt-get install -y pandoc

    - name: Run pandoc tests
      run: uv run pytest -vv tests/test_pandoc.py

  visual-tests:
    runs-on: macos-latest
    timeout-minutes: 15

    env:
      PYTEST_ADDOPTS: "--color=yes"

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: |
        uv sync
        uv pip list

    - name: Install Playwright browsers
      run: |
        uv run playwright install --with-deps chromium

    - name: Run visual tests
      run: |
        uv run pytest -vv -m visual -n 2 --timeout=60

  interactive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTEST_ADDOPTS: "--color=yes"

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: uv sync

    - name: Install Playwright browsers
      run: uv run playwright install --with-deps chromium

    - name: Run interactive tests
      run: uv run pytest tests/interactive/ -vv --browser chromium --timeout=60

  accessibility-tests:
    runs-on: macos-latest
    timeout-minutes: 15

    env:
      PYTEST_ADDOPTS: "--color=yes"

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: |
        uv sync
        uv pip list

    - name: Install Playwright browsers
      run: |
        uv run playwright install --with-deps chromium

    - name: Run accessibility tests
      run: |
        uv run pytest -vv -m accessibility -n 2 --timeout=180
