name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  pytest:
    runs-on: ${{ matrix.os }}-latest

    env:
      PYTEST_ADDOPTS: "--color=yes"

    strategy:
      matrix:
        os: [ubuntu, macos]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout the repository and submodules
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install rsm-lang
      run: |
        uv sync
        uv pip list

    - name: Install Playwright browsers
      if: matrix.os == 'macos'
      run: |
        uv run playwright install --with-deps chromium

    - name: Run unit tests
      run: |
        if [ "${{ matrix.os }}" = "ubuntu" ]; then
          uv run pytest -vv -m "not visual"
        else
          uv run pytest -vv
        fi

    - name: Run doctests in source files
      run: |
        uv run pytest -vv --doctest-modules rsm

    - name: Run doctests in doc files
      run: |
        cd docs && uv run make doctest
