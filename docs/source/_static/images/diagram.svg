<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>

  <!-- Title -->
  <text x="200" y="30" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">
    Simple Diagram Example
  </text>

  <!-- Box 1 -->
  <rect x="50" y="80" width="120" height="60" fill="#E8F4F8" stroke="#2E86AB" stroke-width="2" rx="5"/>
  <text x="110" y="115" font-size="14" text-anchor="middle" font-family="sans-serif">Input Data</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="110" x2="210" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 2 -->
  <rect x="210" y="80" width="120" height="60" fill="#F8E8F4" stroke="#A23B72" stroke-width="2" rx="5"/>
  <text x="270" y="105" font-size="14" text-anchor="middle" font-family="sans-serif">Processing</text>
  <text x="270" y="125" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#666">Algorithm</text>

  <!-- Arrow 2 -->
  <line x1="270" y1="140" x2="270" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 3 -->
  <rect x="210" y="180" width="120" height="60" fill="#F8F4E8" stroke="#F18F01" stroke-width="2" rx="5"/>
  <text x="270" y="215" font-size="14" text-anchor="middle" font-family="sans-serif">Results</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Note -->
  <text x="200" y="270" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#666">
    Figure 1: Basic workflow diagram
  </text>
</svg>
